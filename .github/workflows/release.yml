name: Release

# Push a tag vX.Y.Z (after the version bump is on main): this builds
# replyze.zip, creates the GitHub release with the notes from CHANGELOG.md,
# and deploys to wordpress.org when the repository variable
# WORDPRESS_ORG_DEPLOY is "true". The SVN credentials are secrets of the
# protected environment "wordpress-org" only. See RELEASING.md.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the plugin version
        run: |
          set -e
          v="${GITHUB_REF_NAME#v}"
          grep -q "^ \* Version: *$v$" replyze/replyze.php
          grep -q "^define( 'REPLYZE_VERSION', '$v' );" replyze/replyze.php
          grep -q "^Stable tag: $v$" replyze/readme.txt
          grep -q "^= $v =" replyze/readme.txt
          grep -q "^## \[$v\]" CHANGELOG.md

      - name: Build replyze.zip (top folder replyze/)
        run: bash bin/build-zip.sh

      - name: Release notes from CHANGELOG.md
        run: |
          set -e
          bash bin/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
          test -s notes.md
          cat notes.md

      - name: Create the release, or attach the ZIP to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/replyze.zip --clobber
          else
            gh release create "$tag" dist/replyze.zip --verify-tag \
              --title "Replyze for WordPress ${tag#v}" --notes-file notes.md
          fi

      - name: wordpress.org deploy is off
        if: vars.WORDPRESS_ORG_DEPLOY != 'true'
        run: echo "::notice::Not deployed to wordpress.org (the repository variable WORDPRESS_ORG_DEPLOY is not true). See RELEASING.md."

  wordpress-org:
    name: wordpress.org SVN
    needs: github
    if: vars.WORDPRESS_ORG_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # SVN_USERNAME and SVN_PASSWORD are secrets of this environment, not of the
    # repository: only a job that names the environment (on a tag its rules
    # allow) can read them. The deploy action is pinned to a commit.
    environment: wordpress-org
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Deploy to wordpress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: replyze
          BUILD_DIR: replyze
          ASSETS_DIR: .wordpress-org
